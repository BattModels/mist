[tool.poetry]
name = "electrolyte-fm"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
torch = {version = "~2.3"}
torchmetrics = "^1.4.0"
lightning = "~2.3"
jsonargparse = {extras = ["signatures", "jsonnet"], version = "^4.27"}
transformers = "^4.40"
deepspeed = { git = "https://github.com/microsoft/DeepSpeed.git", rev = "5f631abc2f930ecece38fae05dc9bd3923c555dd"}
wandb = "^0.16"
typer = "^0.9"
datasets = "^2.20"
pyspark = "^3.5.0"
smirk = {path = "smirk", develop=true}
rich = "^13"
pydoe2 = "^1.3"
jsonnet = "^0.20.0"
scikit-learn= "^1.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pre-commit = "^3.7"
ruff = "^0.5.4"

[tool.poetry.group.tokenizers.dependencies]
# Optional Dependencies for third-party tokenizers
smilespe = "0.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--color yes"

[tool.ruff.lint]
ignore = ["F401"]

[tool.ruff.lint.extend-per-file-ignores]
"test_*.py" = ["F811"]
