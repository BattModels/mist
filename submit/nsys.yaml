nsys:
  trace: cuda,cudnn,cublas,nvtx
  o: "nsys_multinode_%q{JOBID}_%q{NODE_RANK}"
  sampling-period: 16000000
  duration: 200
  # sample: none # Disable CPU Profiling

  # Uncomment to profile GPU memory usage
  # cuda-memory-usage: 'true'
train:
  trainer:
    fast_dev_run: 10
    profiler:
      class_path: lightning.pytorch.profiler.NsysProfiler
      init_args:
        emit_nvtx: true
