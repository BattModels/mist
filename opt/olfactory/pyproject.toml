[project]
name = "olfactory"
version = "0.1.0"
description = "Plots and analysis using MIST olfaction model"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "torch~=2.6",
    "transformers>=4.40",
    "scikit-learn>=1.5.1",
    "rdkit>=2024.3.5",
    "pandas>=2.2.3",
    "numpy>=2.2.4",
    "scipy>=1.11.0",
    "smirk>=0.2.0",
    "datasets>=4.6.1",
]
