  # data/benchmarks/sources; BF3 affinity is not the Gutmann DN scale.
  - {key: dn-28m, dataset: dn, path: ../../data/screening-heads/supplied-seed42/dn, targets: [BF3 affinity], split: supplied-seed42, task: regression, metric: rmse, metrics: [rmse, mae], unit: kJ/mol, table: design_heads, base: mist-28m, release: {id: mist-models/mist-26.9M-6hk5coof-dn, revision: fe2532a82ec917d334baf62a768a593e46acd32e, validation_value: null}}
