schema_version: 1
provenance:
  paper_values: data/paper-source/main.tex
  reproduced_release_metrics: runs/released-checkpoint-scores/scores.csv
  note: Paper-table rows reproduce the manuscript validation values; acquired-model rows are reported separately and never silently substituted.
base_models:
  mist-28m:
    id: mist-models/mist-28M-ti624ev1
    revision: bfeebb7a2619a61d321de922b66376f5cb682eef
  mist-1p8b:
    id: mist-models/mist-1.8B-dh61satt
    revision: ed6df0875e4425ede9b12019bbd8c2a3c439052d
datasets: [bbbp, hiv, bace, tox21, clintox, sider, esol, freesolv, lipo, qm8, qm9, muv]
surprise_baselines:
  molformer:
    id: ibm-research/MoLFormer-XL-both-10pct
    stage_key: surprise-molformer-transformers-v4
    # Upstream's compat-v4 revision; the model.safetensors weights are identical
    # to 361063d0ad524ef77cf39b08469f6be770dc550f (sha256: 0795977fe7192c4a...).
    revision: 7b12d946c181a37f6012b9dc3b002275de070314
  chemberta:
    id: seyonec/ChemBERTa-zinc-base-v1
    revision: 761d6a18cf99db371e0b43baf3e2d21b3e865a20
learning_rates:
  - name: "2e-7"
    value: "2e-7"
  - name: "6e-7"
    value: "6e-7"
  - name: "2e-6"
    value: "2e-6"
  - name: "6e-6"
    value: "6e-6"
  - name: "2e-5"
    value: "2e-5"
  - name: "6e-5"
    value: "6e-5"
  - name: 1p6e-4
    value: "1.6e-4"
# Eight logarithmically spaced rates per base, including both endpoints.
# Original items above stay unchanged for selection from completed work.
expanded_learning_rates:
  mist-28m:
    - {name: "1e-5", value: "1e-5"}
    - {name: 2p3535469e-5, value: "2.3535469e-5"}
    - {name: 5p539183e-5, value: "5.539183e-5"}
    - {name: 1p3036727e-4, value: "1.3036727e-4"}
    - {name: 3p0682548e-4, value: "3.0682548e-4"}
    - {name: 7p2212816e-4, value: "7.2212816e-4"}
    - {name: 1p6995625e-3, value: "1.6995625e-3"}
    - {name: "4e-3", value: "4e-3"}
  mist-1p8b:
    - {name: "1e-5", value: "1e-5"}
    - {name: 1p9306977e-5, value: "1.9306977e-5"}
    - {name: 3p7275937e-5, value: "3.7275937e-5"}
    - {name: 7p1968567e-5, value: "7.1968567e-5"}
    - {name: 1p3894955e-4, value: "1.3894955e-4"}
    - {name: 2p6826958e-4, value: "2.6826958e-4"}
    - {name: 5p1794747e-4, value: "5.1794747e-4"}
    - {name: "1e-3", value: "1e-3"}
cases:
  # Additional interpretation head; the 24-pair MoleculeNet seed grid is unchanged.
  - {key: toxcast-1p8b, canonical_task: toxcast, base: mist-1p8b, path: ../../data/moleculenet/toxcast, microbatch: "1", effective_batch: "128", release: null}
  # New fits on the accepted available Wolfram cohort. Keep the original two
  # scaled half-life targets and 5,000-step budget; use benchmark LR selection.
  - {key: isotopes-28m, dataset: isotopes, path: ../../data/isotopes/wolfram-seed42, targets: [half_life, log_time], split: wolfram-seed42, task: regression, metric: rmse, metrics: [mae, mae-channel, r2-channel], encoding: smiles, unit: coefficient/exponent, table: isotope_heads, base: mist-28m, microbatch: "16", effective_batch: "16", release: null}
  - {key: isotopes-1p8b, dataset: isotopes, path: ../../data/isotopes/wolfram-seed42, targets: [half_life, log_time], split: wolfram-seed42, task: regression, metric: rmse, metrics: [mae, mae-channel, r2-channel], encoding: smiles, unit: coefficient/exponent, table: isotope_heads, base: mist-1p8b, microbatch: "4", effective_batch: "16", release: null}
  # No published token-level MIST charge head was found; train on the recovered
  # JCIM2017 corpus, not the chemically different later PM6 release.
  - {key: pubchemqc-28m, dataset: pubchemqc, path: ../../data/pubchemqc/pubchemqc_jcim2017-split-v2, targets: [partial-charge-mulliken, hs_partial-charge-mulliken, partial-charge-lowdin, hs_partial-charge-lowdin], split: recovered-jcim2017, task: token-regression, metric: mae, unit: e, table: partial_charge, base: mist-28m, microbatch: "32", effective_batch: "128", gradient_accumulation: "4", release: null}
  - {key: pubchemqc-1p8b, dataset: pubchemqc, path: ../../data/pubchemqc/pubchemqc_jcim2017-split-v2, targets: [partial-charge-mulliken, hs_partial-charge-mulliken, partial-charge-lowdin, hs_partial-charge-lowdin], split: recovered-jcim2017, task: token-regression, metric: mae, unit: e, table: partial_charge, base: mist-1p8b, microbatch: "4", effective_batch: "32", gradient_accumulation: "8", release: null}
  - {key: muv-28m, canonical_task: muv, base: mist-28m, release: {id: mist-models/mist-28M-yr1urd2c-muv, revision: 333919d2d7232bc931731e0ecdb3ecf728ecaf01, validation_value: null}}
  - {key: muv-1p8b, canonical_task: muv, path: ../../data/moleculenet/muv, base: mist-1p8b, microbatch: "4", effective_batch: "32", release: null}
  - {key: qm9-baseline-28m, canonical_task: qm9, variant: baseline, randomize: false, path: ../../data/moleculenet/qm9, base: mist-28m, microbatch: "16", effective_batch: "16", release: null}
